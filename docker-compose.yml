services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=portfolio;Username=postgres;Password=postgres
      - Seq__ServerUrl=http://seq:5341
      - Seq__ApiKey=
    volumes:
      - ./src/Presentation/WebAPI:/app/src/Presentation/WebAPI
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./src/Presentation/WebAPI
          target: /app/src/Presentation/WebAPI
          ignore:
            - bin/
            - obj/

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=portfolio
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data

volumes:
  postgres_data:
  seq_data: